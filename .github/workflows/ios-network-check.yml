name: Recheck built iOS app HTTP networking

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the LXMusic-iOS-simulator-logs artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  network-check:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download previously compiled simulator app
        uses: actions/download-artifact@v7
        with:
          name: LXMusic-iOS-simulator-logs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: build/reused
      - name: Select Xcode and install iOS runtime
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          for attempt in 1 2 3; do
            xcrun simctl list >/dev/null || true
            if xcodebuild -downloadPlatform iOS -buildVersion 18.2 2>&1 | tee -a build/platform-install.log; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Check the existing binary with corrected HTTP fixtures
        run: |
          set -euo pipefail
          unzip -q build/reused/build/simulator-app.zip -d build/reused
          LX_IOS_REUSE_SIMULATOR_APP=build/reused/LxMusicMobile.app bash scripts/smoke-ios.sh
      - name: Upload runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: LXMusic-iOS-network-check
          path: |
            build/*.log
            build/*.json
            build/*.png
            build/crashes/*
          if-no-files-found: error
          retention-days: 3
